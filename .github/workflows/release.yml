name: Build & Release Electron App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Generate Version Tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r ".version" package.json)
          TAG="v$VERSION"
          echo "version=$TAG" >> $GITHUB_OUTPUT


  build:
    name: Build Release Artifacts (${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            build_script: make:linux-x64
          - os: windows-latest
            target: windows-x64
            build_script: make:win32-x64
          - os: windows-latest
            target: windows-ia32
            build_script: make:win32-ia32
          - os: macos-latest
            target: macos-x64
            build_script: make:macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Setup MSBuild (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: microsoft/setup-msbuild@v1.1

      - name: Install dependencies
        run: npm ci --force

      - name: Install Arch package tools
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools

      - name: Build (electron forge)
        run: npm run ${{ matrix.build_script }}

      - name: Build AppImage
        if: matrix.target == 'linux-x64'
        run: npm run make:linux-appimage

      - name: Build Arch package
        if: matrix.target == 'linux-x64'
        run: npm run make:linux-arch

      - name: List generated targets
        shell: bash
        run: |
          echo "Generated files under out/make:"
          find out/make -type f | sort || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.target }}-artifacts-${{ needs.tag.outputs.version }}"
          path: |
            out/make/**/*
            dist/*.AppImage
            dist/*.pkg.tar.*
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: [tag, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download and extract build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts-${{ needs.tag.outputs.version }}"
          path: downloaded-artifacts

      - name: Collect release packages
        shell: bash
        run: |
          mkdir -p release-files

          while IFS= read -r -d '' file; do
            artifact_path="${file#downloaded-artifacts/}"
            artifact_name="${artifact_path%%/*}"
            target="${artifact_name%%-artifacts-*}"
            cp "$file" "release-files/${target}-$(basename "$file")"
          done < <(
            find downloaded-artifacts -type f \
              \( -iname '*.deb' \
              -o -iname '*.rpm' \
              -o -iname '*.appimage' \
              -o -iname '*.exe' \
              -o -iname '*.msi' \
              -o -iname '*.appx' \
              -o -iname '*.dmg' \
              -o -iname '*.pkg' \
              -o -iname '*.pkg.tar.*' \
              -o -iname '*.zip' \
              -o -iname '*.nupkg' \) \
              -print0
          )

          if ! find release-files -type f -print -quit | grep -q .; then
            echo "No release packages were found in the downloaded artifacts." >&2
            exit 1
          fi

          echo "Release packages:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create or update draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.version }}
          name: "Release ${{ needs.tag.outputs.version }}"
          artifacts: "release-files/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          draft: true
          prerelease: false
          generateReleaseNotes: true
